name: Check Notes
on:
  schedule:
    - cron: '*/10 * * * *' # GitHub allows every 5-10 mins. 
  workflow_dispatch: # Allows you to run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install seleniumbase requests
      - name: Install xvfb
        run: sudo apt-get install -y xvfb
      - name: Run Monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: xvfb-run --auto-servernum python monitor.py
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add last_state.json
          git commit -m "Update last state" || exit 0
          git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
